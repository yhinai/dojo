name: Test HERD
on: [push, pull_request]
jobs:
  deterministic-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra weave
      - run: uv run pytest -q
      - run: uv run marimo check app/control_room.py
      - run: python3 claude/verify_architecture.py

  docker-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra weave
      - run: uv run playwright install --with-deps chromium
      - run: docker build -t herd-runtime:local .
      - run: HERD_DOCKER_TESTS=1 HERD_BROWSER_TESTS=1 uv run pytest tests/test_runtime.py -q
