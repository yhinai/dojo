name: Test HERD
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra weave
      - run: uv run pytest -q
      - run: uv run marimo check app/control_room.py
      - run: python3 claude/verify_architecture.py
