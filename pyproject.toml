[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herd-learning"
version = "0.1.0"
description = "Verified cross-agent tool learning with marimo and W&B Weave"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "marimo>=0.14,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "typer>=0.15,<1", "tiktoken>=0.9,<1", "playwright>=1.50,<2"]

[project.optional-dependencies]
weave = ["weave>=0.51,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
herd = "herd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/herd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
